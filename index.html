 <!DOCTYPE html>
 <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock paper scissors</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="game-container">
            <h1>Rock Paper Scissors</h1>
            <p>choose Rock, paper, or scissors:</p>
            <div class="buttons">
                <button data-choice="rock">Rock</button>
                <button data-choice="paper">Paper</button>
                <button data-choice="scissors">Scissors</button>
            </div>
            <p>You chose: <span id="player-choice">---</span></p>
            <p>computer chose: <span id="computer-choice">---</span></p>
            <h2>Score (Best 3 of 5)</h2>
            <p>player: <span id="player-score">0</span></p>
            <p>computer: <span id="computer-score">0</span></p>
        </main>
        <script src="script.js"></script>

</body>

</html>
